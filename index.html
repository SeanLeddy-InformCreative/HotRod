<!DOCTYPE html>
<html>
<head>
    <title>Stan's Hot Rod Quote Generator</title>
    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .title {
            margin-bottom: 30px;
        }

        .title span:first-child {
            color: #ff0000;
            font-size: 32px;
            font-weight: bold;
        }

        .title span:last-child {
            color: #0000ff;
            font-size: 32px;
            font-weight: bold;
        }

        #quote-display {
            font-size: 24px;
            margin: 40px;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            min-height: 100px;
        }

        .cool-beans-button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .cool-beans-button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <div class="title">
        <span>Stan's Personal </span>
        <span>Hot Rod Inspirational Quote Generator</span>
    </div>

    <div id="quote-display">
        Click the button below to generate a quote!

</body>
</html>
